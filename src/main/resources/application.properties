#Search Service Application Configuration

# Disable Dev Services (we have our own MySQL and Keycloak)
quarkus.devservices.enabled=false
quarkus.datasource.devservices.enabled=false
quarkus.keycloak.devservices.enabled=false

# Application name
quarkus.application.name=search-service

# Server port
quarkus.http.port=8085

# CORS Configuration
quarkus.http.cors.origins=http://localhost:5173,http://localhost:3000
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=Content-Disposition
quarkus.http.cors.access-control-max-age=24H
quarkus.http.cors.access-control-allow-credentials=true

# Database configuration (YOUR existing MySQL)
quarkus.datasource.db-kind=mysql
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:mysql://journal-mysql:3306/patient_system?useSSL=false&allowPublicKeyRetrieval=true}
quarkus.datasource.reactive.url=${QUARKUS_DATASOURCE_REACTIVE_URL:mysql://journal-mysql:3306/patient_system}
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:root}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:admin}

# Hibernate configuration - just validate schema
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=true

# Keycloak OIDC configuration (YOUR existing Keycloak)
quarkus.oidc.auth-server-url=${QUARKUS_OIDC_AUTH_SERVER_URL:http://journal-keycloak:8080/realms/journal-realm}
quarkus.oidc.client-id=${QUARKUS_OIDC_CLIENT_ID:backend-service}
quarkus.oidc.application-type=service
quarkus.oidc.token.issuer=${QUARKUS_OIDC_TOKEN_ISSUER:any}

# Logging
quarkus.log.level=INFO
quarkus.log.category."com.fullstack.searchservice".level=DEBUG
